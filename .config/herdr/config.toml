onboarding = false
# herdr configuration, mirroring ~/.tmux.conf keybinds where herdr has an equivalent.
# Full defaults: `herdr --default-config`. Validate: `herdr config check`.

[theme]
# "terminal" uses the host terminal's ANSI palette
name = "terminal"

auto_switch = false
[keys]
prefix = "ctrl+space"

split_vertical = "prefix+|"
split_horizontal = ['prefix+"', "prefix+minus"]

focus_pane_left = ["prefix+left", "ctrl+h"]
focus_pane_down = ["prefix+down", "ctrl+j"]
focus_pane_up = ["prefix+up", "ctrl+k"]
focus_pane_right = ["prefix+right", "ctrl+l"]

resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"

previous_tab = ["prefix+p", "alt+h"]
next_tab = ["prefix+n", "alt+l"]

workspace_picker = ["prefix+w", "prefix+shift+s"]

# Moved off the default prefix+shift+p, which the popup shell uses
rename_pane = "prefix+comma"

# One-shot popup shell; exit it to close the popup
[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = 'exec "${SHELL:-sh}"'
width = "80%"
height = "80%"

# Knowledge-base beads in a popup; CLICOLOR_FORCE keeps bd colors through less; press q to close
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "cd ~/knowledge && CLICOLOR_FORCE=1 bd list --no-pager | less -R"
width = "80%"
height = "80%"

[ui]
hide_tab_bar_when_single_tab = true

[ui.toast]
# Ask WezTerm to show a macOS notification when a background agent finishes or needs input
delivery = "terminal"

# Show Claude's session title (its own summary of the task) in the agent list
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]
